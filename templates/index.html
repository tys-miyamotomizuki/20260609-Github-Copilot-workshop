<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <section class="timer-panel" aria-label="ポモドーロタイマー">
        <header class="panel-header">
          <h1>ポモドーロタイマー</h1>
          <div class="window-controls" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </header>

        <div class="mode-switcher" role="tablist" aria-label="タイマーモード">
          <button class="mode-chip is-active" type="button" data-mode="focus">作業</button>
          <button class="mode-chip" type="button" data-mode="short_break">短い休憩</button>
          <button class="mode-chip" type="button" data-mode="long_break">長い休憩</button>
        </div>

        <p class="mode-label" data-mode-label>作業中</p>

        <section class="timer-visual" aria-live="polite">
          <div class="progress-ring" data-progress-ring>
            <div class="progress-ring__inner">
              <span class="time-display" data-time-display>25:00</span>
            </div>
          </div>
        </section>

        <div class="action-row">
          <button class="button button-primary" type="button" data-start-button>開始</button>
          <button class="button button-secondary" type="button" data-reset-button>リセット</button>
        </div>

        <section class="stats-card" aria-label="今日の進捗">
          <div class="stats-card__header">今日の進捗</div>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-item__value" data-completed-count>0</div>
              <div class="stat-item__label">完了</div>
            </div>
            <div class="stat-item">
              <div class="stat-item__value" data-focus-duration>0分</div>
              <div class="stat-item__label">集中時間</div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
